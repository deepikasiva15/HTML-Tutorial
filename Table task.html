<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Report Card</title>
  <style>
    table {
      width: 70%;
      border-collapse: collapse;
      margin: 20px auto;
    }
    th, td {
      border: 2px solid #333;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    caption {
      font-size: 1.3em;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <table>
    <caption>Student Report Card</caption>
    <tr>
      <th>Name</th>
      <th>Subject</th>
      <th>Marks</th>
      <th>Grade</th>
    </tr>
    <tr>
      <td rowspan="2">Arun Kumar</td>
      <td>Mathematics</td>
      <td>85</td>
      <td>A</td>
    </tr>
    <tr>
      <td>Science</td>
      <td>78</td>
      <td>B+</td>
    </tr>
    <tr>
      <td>Deepika Sivaprakash</td>
      <td colspan="2">Computer Science (Project + Theory)</td>
      <td>A+</td>
    </tr>
    <tr>
      <td>Meena R</td>
      <td>English</td>
      <td>74</td>
      <td>B</td>
    </tr>
  </table>

</body>
</html>
